<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./asset/video.css" />
    <script src="sweetalert2.min.js"></script>
    <link rel="stylesheet" href="sweetalert2.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <div class="container">
      <div class="head">
        <h3>Tonton & Pelajari Video</h3>
        <p>Pelajari materi melalui video utuh atau per scene</p>
      </div>
      <div class="left">
        <p>Daftar Video</p>
        <div class="scenes">
          <div class="scene" onclick="jumpTo(0)">
            <h4>Scene 1</h4>
            <p>Pertama</p>
          </div>
          <div class="scene" onclick="jumpTo(50)">
            <h4>Scene 2</h4>
            <p>Pertama</p>
          </div>
          <div class="scene" onclick="jumpTo(450)">
            <h4>Scene 3</h4>
            <p>Pertama</p>
          </div>
          <div class="scene" onclick="jumpTo(800)">
            <h4>Scene 4</h4>
            <p>Pertama</p>
          </div>
          <div class="scene" onclick="jumpTo(1100)">
            <h4>Scene 5</h4>
            <p>Pertama</p>
          </div>
          <div class="scene" onclick="jumpTo(1150)">
            <h4>Scene 6</h4>
            <p>Pertama</p>
          </div>
          <div class="scene" onclick="jumpTo(1200)">
            <h4>Scene 7</h4>
            <p>Pertama</p>
          </div>
        </div>
      </div>
      <div id="player"></div>
      <div class="btn-group">
        <button onclick="player.playVideo()">play</button>
        <button onclick="player.pauseVideo()">pause</button>
      </div>
      <div class="info">
        <div class="keterangan">
          <p>keterangan</p>
        </div>
        <div class="petunjuk">
          <p>petunjuk</p>
        </div>
      </div>
    </div>
    <script src="./asset/res/iframe_api.js"></script>
    <script src="./asset/video.js"></script>
  </body>
</html>
